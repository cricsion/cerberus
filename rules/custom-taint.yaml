  # ---------------- PHP ----------------
  - id: custom-php-inject-taint
    languages: [php]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
    pattern-sinks:
      - pattern: eval(...)
      - pattern: exec(...)
      - pattern: system(...)
      - pattern: mysql_query(...)
      - pattern: mysqli_query(...)
    message: Possible injection via superglobal reaching dangerous sink.
    metadata:
