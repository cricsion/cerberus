  - id: custom-php-deser-taint
    languages: [php]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
    pattern-sinks:
      - pattern: unserialize(...)
    message: Possible insecure deserialization of untrusted input.
    metadata:
      cwe: CWE-502
      owasp: "A08:2021 - Software and Data Integrity Failures"
      source: custom-harness

  # ---------------- Open redirect ----------------
  - id: custom-redirect-taint-py
    languages: [python]
    severity: WARNING
    mode: taint
    pattern-sources:
      - pattern: request.args
      - pattern: request.form
      - pattern: request.values
      - pattern: flask.request.$ATTR
      - patterns:
          - pattern-inside: "def $F(..., $SRC, ...): ..."
          - pattern: $SRC
    pattern-sinks:
      - pattern: redirect(...)
      - pattern: django.http.HttpResponseRedirect(...)
    message: Possible open redirect via request-controlled destination.
    metadata:
      cwe: CWE-601
      owasp: "A01:2021 - Broken Access Control"
      source: custom-harness

  - id: custom-redirect-taint-js
    languages: [javascript, typescript]
    severity: WARNING
    mode: taint
    pattern-sources:
      - pattern: req.query.$ATTR
      - pattern: req.params.$ATTR
      - patterns:
          - pattern-inside: "function $F(..., $SRC, ...) {...}"
          - pattern: $SRC
    pattern-sinks:
      - pattern: res.redirect(...)
      - pattern: redirect(...)
    message: Possible open redirect via request-controlled destination.
    metadata:
      cwe: CWE-601
      owasp: "A01:2021 - Broken Access Control"
      source: custom-harness

  - id: custom-redirect-taint-java
    languages: [java]
    severity: WARNING
    mode: taint
    pattern-sources:
      - pattern: $REQ.getParameter(...)
    pattern-sinks:
      - pattern: $RES.sendRedirect(...)
      - pattern: redirect(...)
    message: Possible open redirect via request-controlled destination.
    metadata:
      cwe: CWE-601
      owasp: "A01:2021 - Broken Access Control"
      source: custom-harness

  - id: custom-redirect-taint-go
    languages: [go]
    severity: WARNING
    mode: taint
    pattern-sources:
      - pattern: $R.URL.Query().Get(...)
    pattern-sinks:
      - pattern: http.Redirect(...)
    message: Possible open redirect via request-controlled destination.
    metadata:
      cwe: CWE-601
      owasp: "A01:2021 - Broken Access Control"
