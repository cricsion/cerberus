# Custom Semgrep taint rules — sink families the public registry misses or
# under-specifies for our harness (project-wrapper sinks, framework gaps).
# Every rule carries metadata.cwe so each hit carries its CWE into the finding
# contract directly; the pack and the regex prefilter are kept in lockstep
# (every family here must keep an always-available prefilter signal).
# Taint mode: sources -> sinks unless a sanitizer fires.
rules:
  # ---------------- Python ----------------
  - id: custom-py-sqli-taint
    languages: [python]
    severity: ERROR
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: "def $F(..., $SRC, ...): ..."
          - pattern: $SRC
      - pattern: flask.request.$ATTR
      - pattern: request.$ATTR
      - pattern: input(...)
    pattern-sinks:
      - pattern: $C.execute(...)
      - pattern: $C.executemany(...)
      - pattern: $M.raw(...)
    pattern-sanitizers:
      - pattern: int(...)
      # Literal query text = parameterized/bound call: the sink itself is safe.
      - pattern: $C.execute("...", ...)
      - pattern: $C.executemany("...", ...)
    message: Possible SQL injection via string-built query reaching execute().
    metadata:
      cwe: CWE-89
      owasp: "A03:2021 - Injection"
      source: custom-harness

  - id: custom-py-cmd-taint
    languages: [python]
    severity: ERROR
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: "def $F(..., $SRC, ...): ..."
          - pattern: $SRC
      - pattern: flask.request.$ATTR
      - pattern: input(...)
      - pattern: sys.argv
    pattern-sinks:
      - pattern: os.system(...)
      - pattern: os.popen(...)
      - patterns:
          - pattern: subprocess.$F(...)
          - pattern: shell=True
    pattern-sanitizers:
      - pattern: shlex.quote(...)
    message: Possible OS command injection reaching a shell sink.
    metadata:
      cwe: CWE-78
      owasp: "A03:2021 - Injection"
      source: custom-harness

  - id: custom-py-xss-taint
    languages: [python]
    severity: WARNING
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: "def $F(..., $SRC, ...): ..."
          - pattern: $SRC
      - pattern: flask.request.$ATTR
    pattern-sinks:
      - pattern: flask.render_template_string(...)
      - pattern: flask.Response(...)
      - pattern: django.http.HttpResponse(...)
      - pattern: return $X + ...
    pattern-sanitizers:
      - pattern: flask.escape(...)
      - pattern: markupsafe.escape(...)
    message: Possible XSS via untrusted data reaching an HTML response sink.
    metadata:
      cwe: CWE-79
      owasp: "A03:2021 - Injection"
      source: custom-harness

  - id: custom-py-path-taint
    languages: [python]
    severity: WARNING
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: "def $F(..., $SRC, ...): ..."
          - pattern: $SRC
      - pattern: flask.request.$ATTR
    pattern-sinks:
      - pattern: open(...)
      - pattern: flask.send_file(...)
      - pattern: flask.send_from_directory(...)
    pattern-sanitizers:
      - pattern: werkzeug.utils.safe_join(...)
    message: Possible path traversal via untrusted data reaching a file sink.
    metadata:
      cwe: CWE-22
      owasp: "A01:2021 - Broken Access Control"
      source: custom-harness

  # ---------------- JavaScript / TypeScript ----------------
  - id: custom-js-eval-taint
    languages: [javascript, typescript]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: req.query.$ATTR
      - pattern: req.params.$ATTR
      - pattern: req.body.$ATTR
      - patterns:
          - pattern-inside: function $F(..., $SRC, ...) {...}
          - pattern: $SRC
    pattern-sinks:
      - pattern: eval(...)
      - pattern: Function(...)
      - pattern: $CP.exec(...)
      - pattern: $CP.execSync(...)
    message: Possible code/command injection via request data reaching eval/exec.
    metadata:
      cwe: CWE-94
      owasp: "A03:2021 - Injection"
      source: custom-harness

  - id: custom-js-xss-taint
    languages: [javascript, typescript]
    severity: WARNING
    mode: taint
    pattern-sources:
      - pattern: req.query.$ATTR
      - pattern: req.params.$ATTR
    pattern-sinks:
      - patterns:
          - pattern: $EL.innerHTML = ...
      - patterns:
          - pattern: document.write(...)
    message: Possible XSS via request data reaching an HTML sink.
    metadata:
      cwe: CWE-79
      owasp: "A03:2021 - Injection"
      source: custom-harness

  # ---------------- Java ----------------
  - id: custom-java-sqli-taint
    languages: [java]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: $REQ.getParameter(...)
      - pattern: $REQ.getHeader(...)
    pattern-sinks:
      - pattern: $ST.executeQuery(...)
      - pattern: $ST.execute(...)
    pattern-sanitizers:
