    metadata:
      cwe: CWE-611
      owasp: "A05:2021 - Security Misconfiguration"
      source: custom-harness

  - id: custom-py-xpath-taint
    languages: [python]
    severity: ERROR
    mode: taint
    pattern-sources:
      - patterns:
