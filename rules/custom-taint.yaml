  # ---------------- LDAP injection ----------------
  - id: custom-ldap-taint-py
    languages: [python]
    severity: ERROR
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: "def $F(..., $SRC, ...): ..."
          - pattern: $SRC
    pattern-sinks:
      - pattern: $L.search(...)
      - pattern: $L.search_s(...)
      - pattern: $L.search_st(...)
      - pattern: $L.search_ext(...)
    message: Possible LDAP injection via input reaching a search filter.
    metadata:
      cwe: CWE-90
      owasp: "A03:2021 - Injection"
      source: custom-harness

  - id: custom-ldap-taint-java
    languages: [java]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: $REQ.getParameter(...)
    pattern-sinks:
      - pattern: $L.search(...)
    message: Possible LDAP injection via input reaching a search filter.
    metadata:
      cwe: CWE-90
      owasp: "A03:2021 - Injection"
      source: custom-harness

  # ---------------- Debug info exposure (search) ----------------
  - id: custom-debug-info
    languages: [python, javascript, typescript, java]
    severity: WARNING
    mode: search
    patterns:
      - pattern-either:
          - pattern: DEBUG = True
          - pattern: app.run(..., debug=True, ...)
          - pattern: traceback.print_exc(...)
          - pattern: $E.printStackTrace(...)
    message: Debug information exposure risk (stack traces / debug mode).
    metadata:
      cwe: CWE-200
      owasp: "A01:2021 - Broken Access Control"
      source: custom-harness

  # ---------------- Permissive permissions (search) ----------------
  - id: custom-perms-open
    languages: [python, javascript, typescript, php, ruby, c, bash]
    severity: WARNING
    mode: search
    # pattern-regex only: language-agnostic text match. Bare patterns in a
    # multi-language rule silently match nothing (verified quirk).
    patterns:
      - pattern-regex: (?m)(chmod\s+777|os\.chmod\(.*0o?777|umask\s*\(\s*0\s*\))
    message: Overly permissive file permissions.
    metadata:
      cwe: CWE-732
      owasp: "A01:2021 - Broken Access Control"
      source: custom-harness

  # ---------------- Weak password hashing (taint) ----------------
  - id: custom-weakhash-pass-taint-py
    languages: [python]
    severity: ERROR
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: "def $F(..., $P, ...): ..."
          - metavariable-regex:
              metavariable: $P
              regex: (?i).*passw.*
          - pattern: $P
      - pattern: request.form.$ATTR
      - pattern: request.args.$ATTR
    pattern-sinks:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
    message: Possible weak password hashing (fast unsalted hash of a password).
    metadata:
      cwe: CWE-916
      owasp: "A02:2021 - Cryptographic Failures"
      source: custom-harness

  - id: custom-weakhash-pass-taint-js
    languages: [javascript, typescript]
    severity: ERROR
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: "function $F(..., $P, ...) {...}"
          - metavariable-regex:
              metavariable: $P
              regex: (?i).*passw.*
          - pattern: $P
    pattern-sinks:
      - pattern: md5(...)
      - pattern: sha1(...)
      - pattern: crypto.createHash(...)
    message: Possible weak password hashing (fast unsalted hash of a password).
    metadata:
      cwe: CWE-916
      owasp: "A02:2021 - Cryptographic Failures"
      source: custom-harness

  - id: custom-weakhash-pass-taint-java
    languages: [java]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: $REQ.getParameter(...)
    pattern-sinks:
      - patterns:
          - pattern: MessageDigest.getInstance($A, ...)
          - metavariable-regex:
              metavariable: $A
              regex: "(?i)[\"']?(md5|sha-?1)[\"']?"
    message: Possible weak password hashing (fast unsalted hash of a password).
    metadata:
      cwe: CWE-916
      owasp: "A02:2021 - Cryptographic Failures"
      source: custom-harness

  - id: custom-py-ssrf-taint
    languages: [python]
    severity: ERROR
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: "def $F(..., $SRC, ...): ..."
          - pattern: $SRC
      - pattern: flask.request.$ATTR
      - pattern: request.$ATTR
    pattern-sinks:
      - pattern: requests.get($URL, ...)
      - pattern: requests.post($URL, ...)
      - pattern: requests.request(..., $URL, ...)
      - pattern: urllib.request.urlopen($URL, ...)
      - pattern: httpx.get($URL, ...)
      - pattern: httpx.post($URL, ...)
    message: Possible SSRF reaching outbound HTTP request sink.
    metadata:
      cwe: CWE-918
      owasp: "A10:2021 - Server-Side Request Forgery"
      source: custom-harness

  - id: custom-py-deser-taint
    languages: [python]
    severity: ERROR
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: "def $F(..., $SRC, ...): ..."
          - pattern: $SRC
      - pattern: flask.request.$ATTR
      - pattern: request.$ATTR
    pattern-sinks:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: _pickle.loads(...)
      - pattern: yaml.load(..., Loader=yaml.Loader)
      - pattern: yaml.load($D)
      - pattern: yaml.unsafe_load(...)
      - pattern: marshal.loads(...)
      - pattern: jsonpickle.decode(...)
    message: Possible insecure deserialization of untrusted input.
    metadata:
      cwe: CWE-502
      owasp: "A08:2021 - Software and Data Integrity Failures"
      source: custom-harness

  - id: custom-py-code-exec-taint
    languages: [python]
    severity: ERROR
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: "def $F(..., $SRC, ...): ..."
