          - pattern: $SRC
      - pattern: flask.request.$ATTR
      - pattern: request.$ATTR
    pattern-sinks:
      - pattern: $TREE.xpath(...)
      - pattern: $TREE.evaluate(...)
    message: Possible XPath injection reaching XPath query sink.
    metadata:
      cwe: CWE-643
      owasp: "A03:2021 - Injection"
      source: custom-harness

