    message: Possible OS command injection via request data.
    metadata:
      cwe: CWE-78
      owasp: "A03:2021 - Injection"
      source: custom-harness

  # ---------------- Go ----------------
  - id: custom-go-cmd-taint
    languages: [go]
    severity: ERROR
    mode: taint
    pattern-sources:
