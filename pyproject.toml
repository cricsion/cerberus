[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cerberus"
version = "0.1.0"
description = "Agentic multi-agent security scanning harness: LLM-driven discovery, triage, validation, PoC, and threat modeling over a CodeGraph index."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Cerberus Maintainers" }]
requires-python = ">=3.12,<3.13"

dependencies = [
    "langchain-core>=1.6.6,<2",
    "langchain-openai>=1.6.6,<2",
    "langchain>=1.4.3,<2",
    "langgraph>=1.2.11,<1.3",
    "deepagents>=0.7.21,<0.8",
    "openai>=3.22,<4",
    "pydantic>=2.7.4,<3",
    "pyyaml>=6.0",
    "rich>=13.7,<16",
    "langfuse>=5.0.2,<6",
    "docker>=7,<8",
    "requests>=2.32",
    "tree-sitter>=0.24,<0.26",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-rust>=0.24",
    "tree-sitter-c>=0.24",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-php>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-kotlin>=0.24",
    "tree-sitter-swift>=0.7",
    "tree-sitter-elixir>=0.3",
    "tree-sitter-fortran>=0.6",
    "tree-sitter-groovy>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
cerberus = "cerberus.cli:main"

[tool.setuptools]
package-dir = { cerberus = "" }
packages = [
    "cerberus",
    "cerberus.agents",
    "cerberus.codegraph",
    "cerberus.partitioning",
    "cerberus.prompts",
    "cerberus.reporting",
    "cerberus.sandbox",
    "cerberus.threat",
    "cerberus.tools",
]

[tool.setuptools.package-data]
cerberus = ["config/*.yaml", "rules/**/*.yaml"]
"cerberus.prompts" = ["templates/**/*.md"]
"cerberus.sandbox" = ["docker/**"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "E501",
    "UP045",
    "SIM105",
    "RUF005",
    "B905",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "SIM", "RUF012", "E741", "F841", "RUF059", "UP007", "F811", "F401"]
"tools/codegraph.py" = ["F401"]
"threat/__init__.py" = ["F401"]
"codegraph/__init__.py" = ["F401"]
"agents/validator.py" = ["B023"]
